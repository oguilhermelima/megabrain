# Colour and host-terminal parity
set -g default-terminal "tmux-256color"
# RGB keeps xterm-256color applications from being quantised to 256 colours.
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -sg escape-time 0
set -g mouse on
set -g aggressive-resize on
set -g set-titles on
set -g set-titles-string '#{?@megabrain_name,#{@megabrain_name},#{pane_title}}'

# Native pane headers and terminal-relative colours
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-status top
set -g pane-border-style 'fg=brightblack,bg=default'
set -g pane-active-border-style 'fg=blue,bg=default'
set -g pane-border-format '#[fg=brightblack]#{?pane_active,#[fg=blue],}#{?@megabrain_agent,#{@megabrain_agent},#{pane_current_command}}#[default] · #{?@megabrain_name,#{@megabrain_name},#{pane_title}}#{?@megabrain_state, · #{?#{==:#{@megabrain_state},working},#[fg=blue]●,#{?#{==:#{@megabrain_state},question},#[fg=yellow]?,#{?#{==:#{@megabrain_state},finished},#[fg=green]✓,#{?#{==:#{@megabrain_state},stuck},#[fg=red]!,#{?#{==:#{@megabrain_state},idle},#[fg=brightblack]○,}}}}},}#[default]'

# Keep the status line only when a session has multiple windows.
set -g status off
set -g status-position bottom
set -g status-style 'bg=default,fg=default'
set -g status-left '#[fg=default]#{session_name} '
set -g status-right ''
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[fg=blue,bold] #I:#W '
set -g message-style 'bg=default,fg=default'
set -g mode-style 'bg=default,fg=default'
set -g copy-mode-match-style 'bg=default,fg=blue'
set -g copy-mode-current-match-style 'bg=default,fg=yellow'
set-hook -g after-new-session 'if-shell -F "#{>:#{session_windows},1}" "set-option status on" "set-option status off"'
set-hook -g after-new-window 'if-shell -F "#{>:#{session_windows},1}" "set-option status on" "set-option status off"'
set-hook -g window-unlinked 'if-shell -F "#{>:#{session_windows},1}" "set-option status on" "set-option status off"'
if-shell -b 'command -v pbcopy >/dev/null 2>&1' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy'
if-shell -b 'command -v pbcopy >/dev/null 2>&1' 'bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel pbcopy'

# Splits and windows inherit the current pane path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
