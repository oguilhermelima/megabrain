[package]
name = "megabrain-desktop"
version = "0.2.4"
description = "Install megabrain and see what it is doing"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "megabrain_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
